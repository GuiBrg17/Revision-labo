<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programme de révision — Lola</title>
<style>
  :root{
    --accent:#258AB3;
    --accent-dark:#1c6a8a;
    --bg:#f4f7f9;
    --card:#ffffff;
    --text:#1f2a30;
    --muted:#5a6b73;
    --border:#dfe7eb;
    --done:#e7f5ec;
    --done-border:#8fc9a3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Georgia, 'Times New Roman', serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    color:#fff;
    padding:28px 20px 22px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  header h1{margin:0 0 4px;font-size:1.5rem;letter-spacing:.3px;}
  header p{margin:0;font-size:.9rem;opacity:.9;}

  .progress-wrap{
    max-width:900px;
    margin:14px auto 0;
    padding:0 10px;
  }
  .progress-bar{
    background:rgba(255,255,255,.3);
    border-radius:20px;
    height:14px;
    overflow:hidden;
  }
  .progress-fill{
    background:#fff;
    height:100%;
    width:0%;
    transition:width .3s ease;
  }
  .progress-label{
    font-size:.8rem;
    margin-top:6px;
    opacity:.95;
  }

  .controls{
    max-width:900px;
    margin:18px auto 0;
    padding:0 16px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:center;
  }
  .controls select, .controls input[type="text"]{
    font-family:Georgia, serif;
    padding:8px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
    color:var(--text);
    font-size:.9rem;
  }
  .controls button{
    font-family:Georgia, serif;
    padding:8px 14px;
    border:1px solid var(--accent);
    border-radius:8px;
    background:#fff;
    color:var(--accent);
    cursor:pointer;
    font-size:.9rem;
  }
  .controls button:hover{background:var(--accent);color:#fff;}
  #syncLinkInput{
    font-family:Georgia, serif;
    padding:8px 12px;
    border:1px solid var(--accent);
    border-radius:8px;
    background:#fff;
    color:var(--text);
    font-size:.85rem;
  }

  main{
    max-width:900px;
    margin:20px auto 60px;
    padding:0 16px;
  }

  .phase-title{
    color:var(--accent-dark);
    font-size:1.05rem;
    margin:32px 0 12px;
    padding-bottom:6px;
    border-bottom:2px solid var(--accent);
  }
  .phase-title:first-child{margin-top:0;}

  .week{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:14px;
    overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .week-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    cursor:pointer;
    background:#fbfdfe;
    user-select:none;
  }
  .week-header:hover{background:#f0f7fa;}
  .week-title{
    font-weight:bold;
    color:var(--accent-dark);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .week-badge{
    background:var(--accent);
    color:#fff;
    font-size:.75rem;
    padding:3px 9px;
    border-radius:12px;
    font-family:Georgia, serif;
  }
  .week-progress-mini{
    font-size:.8rem;
    color:var(--muted);
  }
  .chevron{
    transition:transform .2s ease;
    color:var(--accent);
    font-size:1rem;
  }
  .week.open .chevron{transform:rotate(90deg);}

  .week-body{
    display:none;
    padding:4px 18px 16px;
  }
  .week.open .week-body{display:block;}

  .day-row{
    border-top:1px solid var(--border);
    padding:12px 0;
    display:grid;
    grid-template-columns:26px 1fr;
    gap:10px;
    align-items:start;
  }
  .day-row:hover{background:#fafcfd;}
  .day-row.done{background:var(--done);}
  .day-row.done .day-name, .day-row.done .subj{color:var(--accent-dark);}

  .check{
    margin-top:3px;
    width:19px;
    height:19px;
    accent-color:var(--accent);
    cursor:pointer;
  }
  .day-name{
    font-weight:bold;
    color:var(--text);
    font-size:.85rem;
    text-transform:uppercase;
    letter-spacing:.4px;
  }
  .subj{
    color:var(--accent);
    font-weight:bold;
    margin-left:6px;
  }
  .day-meta{
    font-size:.85rem;
    color:var(--muted);
    margin-top:3px;
    line-height:1.5;
  }
  .day-meta .chap{font-style:italic;color:var(--text);}
  .day-meta .pages{white-space:nowrap;}
  .day-meta .detail{display:block;margin-top:4px;color:var(--text);}
  .day-meta .time{
    display:inline-block;
    margin-top:6px;
    background:#eef6f9;
    color:var(--accent-dark);
    padding:2px 9px;
    border-radius:10px;
    font-size:.78rem;
  }
  .bilan .subj{color:#b3762c;}
  .bilan{border-left:3px solid #e3b673;}

  footer{
    text-align:center;
    color:var(--muted);
    font-size:.8rem;
    padding:20px;
  }

  .hidden{display:none !important;}

  @media (max-width:600px){
    header h1{font-size:1.2rem;}
    .week-title{font-size:.95rem;}
  }
</style>
</head>
<body>

<header>
  <h1>Programme de révision — Lola</h1>
  <p>25 semaines · Maths, Physique &amp; Chimie</p>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 0 séances terminées</div>
    <div class="progress-label" id="syncStatus" style="margin-top:4px;">Initialisation...</div>
  </div>
</header>

<div class="controls">
  <select id="filterMatiere">
    <option value="all">Toutes les matières</option>
    <option value="Maths">Maths</option>
    <option value="Physique">Physique</option>
    <option value="Chimie">Chimie</option>
    <option value="Bilan">Bilan / Examen</option>
  </select>
  <button id="expandAll">Tout ouvrir</button>
  <button id="collapseAll">Tout fermer</button>
  <button id="resetProgress">Réinitialiser la progression</button>
  <button id="copySyncLink">Copier le lien de synchro</button>
</div>
<div class="controls" id="syncLinkWrap" style="display:none;">
  <input type="text" id="syncLinkInput" readonly style="flex:1;min-width:220px;">
</div>

<main id="main"></main>

<footer>Coche les séances au fur et à mesure — ta progression est sauvegardée automatiquement sur cet appareil.</footer>

const STORAGE_KEY = "lola-revision-progress-v1";
const SYNC_ID_KEY = "lola-revision-sync-id";
const WORKER_API = "https://revision-labo.guillaume-branger17.workers.dev";

function loadLocalProgress(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveLocalProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
}
let progress = loadLocalProgress();

// --- Synchro multi-appareils (Cloudflare Worker + KV) ---
let syncId = null;
let syncStatusEl = null;
let syncTimer = null;

function getSyncIdFromUrl(){
  const hash = window.location.hash;
  const match = hash.match(/sync=([a-zA-Z0-9-]+)/);
  return match ? match[1] : null;
}

function setSyncIdInUrl(id){
  history.replaceState(null, "", window.location.pathname + window.location.search + "#sync=" + id);
}

function setSyncStatus(text){
  if(syncStatusEl) syncStatusEl.textContent = text;
}

async function initSync(){
  syncId = getSyncIdFromUrl() || localStorage.getItem(SYNC_ID_KEY);

  if(!syncId){
    // Première ouverture : on crée un espace de synchro
    setSyncStatus("Création de la synchro...");
    try{
      const res = await fetch(WORKER_API + "/new", { method: "POST" });
      const data = await res.json();
      syncId = data.id;
      localStorage.setItem(SYNC_ID_KEY, syncId);
      setSyncIdInUrl(syncId);
      setSyncStatus("Synchro activée — utilise ce lien sur tous les appareils.");
    }catch(e){
      setSyncStatus("Hors ligne — sauvegarde locale uniquement.");
      return;
    }
  } else {
    localStorage.setItem(SYNC_ID_KEY, syncId);
    setSyncIdInUrl(syncId);
    // Récupérer la progression distante et fusionner (le distant fait foi)
    try{
      setSyncStatus("Synchronisation...");
      const res = await fetch(WORKER_API + "/" + syncId);
      if(res.ok){
        const remote = await res.json();
        progress = Object.assign({}, progress, remote);
        saveLocalProgress(progress);
        render();
      }
      setSyncStatus("Synchronisé sur cet appareil.");
    }catch(e){
      setSyncStatus("Hors ligne — sauvegarde locale uniquement.");
    }
  }
}

function pushSync(){
  if(!syncId) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async ()=>{
    try{
      setSyncStatus("Synchronisation...");
      await fetch(WORKER_API + "/" + syncId, {
        method: "PUT",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(progress)
      });
      setSyncStatus("Synchronisé sur cet appareil.");
    }catch(e){
      setSyncStatus("Hors ligne — changement gardé en local, réessaiera plus tard.");
    }
  }, 600);
}

function saveProgress(p){
  saveLocalProgress(p);
  pushSync();
}

function matiereCategory(m){
  if(m.includes("Maths")) return "Maths";
  if(m.includes("Physique")) return "Physique";
  if(m.includes("Chimie")) return "Chimie";
  return "Bilan";
}

function dayId(weekNum, jour, idx){ return weekNum+"-"+idx+"-"+jour; }

function render(){
  const main = document.getElementById("main");
  main.innerHTML = "";
  let totalDays = 0, doneDays = 0;

  DATA.forEach(phase=>{
    const phaseTitle = document.createElement("div");
    phaseTitle.className = "phase-title";
    phaseTitle.textContent = phase.phase;
    main.appendChild(phaseTitle);

    phase.weeks.forEach(week=>{
      const weekDiv = document.createElement("div");
      weekDiv.className = "week";
      weekDiv.dataset.week = week.num;

      const header = document.createElement("div");
      header.className = "week-header";

      const doneCount = week.days.filter((d,i)=>progress[dayId(week.num,d.jour,i)]).length;
      totalDays += week.days.length;
      doneDays += doneCount;

      header.innerHTML = `
        <div class="week-title"><span class="chevron">&#9656;</span> Semaine <span class="week-badge">${week.num}</span></div>
        <div class="week-progress-mini">${doneCount}/${week.days.length} faites</div>
      `;
      header.addEventListener("click", ()=>{
        weekDiv.classList.toggle("open");
      });

      const body = document.createElement("div");
      body.className = "week-body";

      week.days.forEach((d, idx)=>{
        const id = dayId(week.num, d.jour, idx);
        const cat = matiereCategory(d.matiere);
        const row = document.createElement("div");
        row.className = "day-row" + (cat==="Bilan" ? " bilan" : "") + (progress[id] ? " done" : "");
        row.dataset.cat = cat;

        row.innerHTML = `
          <input type="checkbox" class="check" ${progress[id] ? "checked" : ""}>
          <div>
            <span class="day-name">${d.jour}</span><span class="subj">${d.matiere}</span>
            <div class="day-meta">
              <span class="chap">${d.chapitre}</span> —
              <span class="pages">${d.livre}${d.pages && d.pages!=="N/A" ? ", "+d.pages : ""}</span>
              <span class="detail">${d.detail}</span>
              <span class="time">${d.temps}</span>
            </div>
          </div>
        `;
        const checkbox = row.querySelector(".check");
        checkbox.addEventListener("change", ()=>{
          progress[id] = checkbox.checked;
          saveProgress(progress);
          row.classList.toggle("done", checkbox.checked);
          updateWeekMini(weekDiv, week);
          updateGlobalProgress();
        });
        body.appendChild(row);
      });

      weekDiv.appendChild(header);
      weekDiv.appendChild(body);
      main.appendChild(weekDiv);
    });
  });

  updateProgressBar(doneDays, totalDays);
  applyFilter();
}

function updateProgressBar(done, total){
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressLabel").textContent = `${done} / ${total} séances terminées (${pct}%)`;
}

function updateWeekMini(weekDiv, week){
  const doneCount = week.days.filter((d,i)=>progress[dayId(week.num,d.jour,i)]).length;
  weekDiv.querySelector(".week-progress-mini").textContent = `${doneCount}/${week.days.length} faites`;
}

function updateGlobalProgress(){
  let total = 0, done = 0;
  DATA.forEach(phase=>phase.weeks.forEach(week=>{
    total += week.days.length;
    done += week.days.filter((d,i)=>progress[dayId(week.num,d.jour,i)]).length;
  }));
  updateProgressBar(done, total);
}

function applyFilter(){
  const val = document.getElementById("filterMatiere").value;
  document.querySelectorAll(".day-row").forEach(row=>{
    if(val === "all" || row.dataset.cat === val){
      row.classList.remove("hidden");
    } else {
      row.classList.add("hidden");
    }
  });
}

document.getElementById("filterMatiere").addEventListener("change", applyFilter);
document.getElementById("expandAll").addEventListener("click", ()=>{
  document.querySelectorAll(".week").forEach(w=>w.classList.add("open"));
});
document.getElementById("collapseAll").addEventListener("click", ()=>{
  document.querySelectorAll(".week").forEach(w=>w.classList.remove("open"));
});
document.getElementById("resetProgress").addEventListener("click", ()=>{
  if(confirm("Réinitialiser toute la progression ?")){
    progress = {};
    saveProgress(progress);
    render();
  }
});

syncStatusEl = document.getElementById("syncStatus");

document.getElementById("copySyncLink").addEventListener("click", ()=>{
  const link = window.location.href;
  const wrap = document.getElementById("syncLinkWrap");
  const input = document.getElementById("syncLinkInput");
  wrap.style.display = "flex";
  input.value = link;
  input.focus();
  input.select();
  input.setSelectionRange(0, 99999);
  try{
    const ok = document.execCommand("copy");
    if(ok){
      setSyncStatus("Lien copié — colle-le sur ton autre appareil.");
      return;
    }
  }catch(e){}
  navigator.clipboard && navigator.clipboard.writeText(link).then(()=>{
    setSyncStatus("Lien copié — colle-le sur ton autre appareil.");
  }).catch(()=>{
    setSyncStatus("Copie automatique impossible — sélectionne le lien affiché ci-dessus et copie-le manuellement.");
  });
});

render();
// Ouvre la première semaine par défaut
const firstWeek = document.querySelector(".week");
if(firstWeek) firstWeek.classList.add("open");

initSync();
</script>
